input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  ruby {
    code => '
      dos    = %w[neptune smurf pod teardrop back land warezclient processtable udpstorm]
      probe  = %w[satan ipsweep nmap portsweep mscan saint]
      r2l    = %w[guess_passwd ftp_write imap phf multihop warezmaster spy xlock xsnoop snmpguess snmpgetattack httptunnel sendmail named]
      u2r    = %w[buffer_overflow loadmodule perl rootkit xterm ps sqlattack]

      label = event.get("label").to_s.strip.downcase

      if label == "normal"
        event.set("attack_category", "normal")
      elsif dos.include?(label)
        event.set("attack_category", "dos")
      elsif probe.include?(label)
        event.set("attack_category", "probe")
      elsif r2l.include?(label)
        event.set("attack_category", "r2l")
      elsif u2r.include?(label)
        event.set("attack_category", "u2r")
      else
        event.set("attack_category", "unknown")
      end

      # Index-Prefix aus Feld lesen (train oder test)
      prefix = event.get("dataset").to_s
      prefix = "train" if prefix.empty?
      event.set("index_prefix", prefix)
    '
  }

  mutate {
    convert => {
      "duration"          => "integer"
      "src_bytes"         => "integer"
      "dst_bytes"         => "integer"
      "land"              => "integer"
      "wrong_fragment"    => "integer"
      "urgent"            => "integer"
      "hot"               => "integer"
      "num_failed_logins" => "integer"
      "logged_in"         => "integer"
      "num_compromised"   => "integer"
      "count"             => "integer"
      "srv_count"         => "integer"
      "serror_rate"       => "float"
      "rerror_rate"       => "float"
      "same_srv_rate"     => "float"
      "diff_srv_rate"     => "float"
    }
  }

  mutate {
    replace => { "index_prefix" => "nslkdd" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "siem-%{index_prefix}-%{attack_category}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
